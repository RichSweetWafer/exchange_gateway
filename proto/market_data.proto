syntax = "proto3";
package market;

service MarketDataStreamer {
    rpc StreamTicks (StreamRequest) returns (stream PriceTick);
}

message StreamRequest {
    string symbol = 1;
}

message PriceTick {
    string symbol = 1;
    int64 bid_price_fp = 2;
    int64 bid_volume = 3;
    int64 ask_price_fp = 4;
    int64 ask_volume = 5;
    int64 timestamp_ns = 6;
}